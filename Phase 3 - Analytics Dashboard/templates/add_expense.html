{% extends "base.html" %}
{% block title %}{% if is_edit %}Edit{% else %}Add{% endif %} Expense{% endblock %}

{% block content %}
  <header class="page-header">
    <h1>{% if is_edit %}Edit Expense{% else %}Add Expense{% endif %}</h1>
  </header>

  <section class="card form-card">
    {% if error %}
      <div class="flash flash-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="expense-form" novalidate>
      <div class="form-group">
        <label for="amount">Amount (₹)</label>
        <input
          type="number" step="0.01" min="0.01" name="amount" id="amount"
          value="{{ form.amount if form }}"
          class="{% if error and 'Amount' in error %}field-error{% endif %}"
          required
        >
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select name="category" id="category" class="{% if error and 'category' in error %}field-error{% endif %}" required>
          {% for name, icon in categories.items() %}
            <option value="{{ name }}" {% if form and form.category == name %}selected{% endif %}>{{ icon }} {{ name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="description">Description <span class="muted">(optional, but helps you remember)</span></label>
        <input type="text" name="description" id="description" value="{{ form.description if form }}" placeholder="e.g. Lunch with friends">
      </div>

      <div class="form-group">
        <label for="date">Date</label>
        <input
          type="date" name="date" id="date"
          value="{{ form.date if form and form.date else today }}"
          class="{% if error and 'Date' in error %}field-error{% endif %}"
          required
        >
      </div>

      <div class="form-actions">
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">{% if is_edit %}Save Changes{% else %}Add Expense{% endif %}</button>
      </div>
    </form>
  </section>
{% endblock %}
