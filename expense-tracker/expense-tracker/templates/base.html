<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Student Expense Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="app-shell">

    <!-- Sidebar (desktop) / becomes bottom nav on mobile via CSS -->
    <nav class="nav">
      <div class="nav-brand">💸 ExpenseTracker</div>
      <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
        <span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span>
      </a>
      <a href="{{ url_for('add_expense') }}" class="nav-link {% if request.endpoint == 'add_expense' %}active{% endif %}">
        <span class="nav-icon">➕</span><span class="nav-text">Add Expense</span>
      </a>
    </nav>

    <main class="content">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-container">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>

  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
